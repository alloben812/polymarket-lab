[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pmlab"
version = "0.1.0"
description = "Polymarket research toolkit (read-only public data)"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.setuptools]
packages = ["pmlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
